site_name: AWS DVA-C02 y AWS DOP-C01
site_description: Manual de estudio en español para las certificaciones de AWS Certified Developer - Associate (DVA-C02) y AWS Certified DevOps Engineer - Professional (DOP-C01)
site_author: José Antonio Seguido Doblado
site_url: https://seguidodoblado.github.io/AWS-DVA-C02_AWS-DOP-C01/
repo_name: GitHub
repo_url: https://github.com/seguidodoblado/AWS-DVA-C02_AWS-DOP-C01

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.top
    # - navigation.sections
    # - navigation.expand
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
    - scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true

nav:
